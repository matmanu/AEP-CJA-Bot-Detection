[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-detection-aep"
version = "0.4.0"
description = "An ensemble User-Agent bot classifier, usable standalone, with an optional Adobe Experience Platform integration layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Core: only what bot_detection.core needs. `import bot_detection` works
# with nothing more than this installed — no AEP, no SFTP, no extras.
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
# The detection ensemble's actual libraries. Technically optional (core.py
# degrades to the reinforcement regex alone if none are installed), but you
# almost always want at least one of these for real use.
detectors = [
    "device_detector>=5.0",
    "crawler-user-agents>=0.19",
    "crawlerdetect>=0.1",
    "regex>=2023.0",
    "PyYAML>=6.0",
]
# Needed only for the Adobe Experience Platform integration
# (bot_detection.aep_pipeline / bot_detection.cli).
aep = [
    "psycopg2-binary>=2.9",
    "paramiko>=3.4",
    "python-dotenv>=1.0",
]
# Needed only for notebooks/behavioral_detection.ipynb.
behavioral = [
    "tqdm>=4.65",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyod>=1.1",
    "xgboost>=2.0",
]
dev = [
    "pytest>=7.0",
]
all = [
    "bot-detection-aep[detectors,aep,behavioral,dev]",
]

[project.scripts]
bot-detection-aep = "bot_detection.cli:_entry_point"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets `from bot_detection... import ...` in tests/ find the package inside
# src/, without installing the project.
pythonpath = ["src"]
testpaths = ["tests"]
